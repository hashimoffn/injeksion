<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İNJEKSİON — Luxury Eco-Tech &amp; Şəhərsalma Ekosistemi</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <!-- Ambient Architectural Background Glows -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb orb-emerald"></div>
    <div class="ambient-orb orb-concrete"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Top Navigation Bar (Direct Access — Opens to TANITIM, No Login/Auth) -->
  <header class="top-nav glass-panel">
    <div class="nav-inner">
      <button class="brand-btn" id="brand-home" type="button" aria-label="İNJEKSİON Tanıtım Ekranı">
        <div class="brand-logo" id="brand-logo-svg" aria-hidden="true"></div>
        <div class="brand-text">
          <span class="brand-name">İNJEKSİON</span>
          <span class="brand-sub">LUXURY ECO-TECH</span>
        </div>
      </button>

      <nav class="main-tabs" role="tablist" aria-label="Əsas Bölmələr">
        <button class="nav-tab active" id="tab-tanitim" data-tab="tanitim" role="tab" aria-selected="true" aria-controls="view-tanitim" type="button">
          <span class="tab-icon" data-icon="presentation" aria-hidden="true"></span>
          <span class="tab-copy">
            <span class="tab-title">TANITIM</span>
            <span class="tab-meta">Layihə &amp; Vizyon</span>
          </span>
        </button>

        <button class="nav-tab" id="tab-mikro" data-tab="mikro" role="tab" aria-selected="false" aria-controls="view-mikro" type="button">
          <span class="tab-icon" data-icon="cube" aria-hidden="true"></span>
          <span class="tab-copy">
            <span class="tab-title">MİKRO</span>
            <span class="tab-meta">B2C <span aria-hidden="true">•</span> 3D Yapboz</span>
          </span>
        </button>

        <button class="nav-tab" id="tab-mezo" data-tab="mezo" role="tab" aria-selected="false" aria-controls="view-mezo" type="button">
          <span class="tab-icon" data-icon="building" aria-hidden="true"></span>
          <span class="tab-copy">
            <span class="tab-title">MEZO</span>
            <span class="tab-meta">B2B <span aria-hidden="true">•</span> Kommersiya</span>
          </span>
        </button>

        <button class="nav-tab" id="tab-makro" data-tab="makro" role="tab" aria-selected="false" aria-controls="view-makro" type="button">
          <span class="tab-icon" data-icon="map" aria-hidden="true"></span>
          <span class="tab-copy">
            <span class="tab-title">MAKRO</span>
            <span class="tab-meta">B2G <span aria-hidden="true">•</span> Peyk &amp; GIS</span>
          </span>
        </button>

        <button class="nav-tab" id="tab-magaza" data-tab="magaza" role="tab" aria-selected="false" aria-controls="view-magaza" type="button">
          <span class="tab-icon" data-icon="store" aria-hidden="true"></span>
          <span class="tab-copy">
            <span class="tab-title">MAĞAZA</span>
            <span class="tab-meta">Eko-Bazar</span>
          </span>
        </button>
      </nav>

      <div class="nav-actions">
        <button class="advisor-trigger-btn" id="open-advisor-btn" type="button" title="Eko-Məsləhətçi Sİ">
          <span data-icon="bot" aria-hidden="true"></span>
          <span class="advisor-label">Eko-Məsləhətçi Sİ</span>
        </button>

        <button class="cart-trigger-btn" id="open-cart-btn" type="button" aria-label="Səbəti aç">
          <span class="cart-icon-wrap" data-icon="cart" aria-hidden="true"></span>
          <span class="cart-label">Səbət</span>
          <span class="cart-badge" id="cart-count-badge">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="app-main" id="app-main">
    <!-- TAB 0: TANITIM (Slayd əvəzi açılış təqdimat səhifəsi) -->
    <section class="tab-view active" id="view-tanitim" role="tabpanel" aria-labelledby="tab-tanitim"></section>

    <!-- TAB 1: MİKRO (B2C — 3D Yapboz Vizualizatoru) -->
    <section class="tab-view" id="view-mikro" role="tabpanel" aria-labelledby="tab-mikro" hidden></section>

    <!-- TAB 2: MEZO (B2B — Otel/Restoran/Biznes/SPA) -->
    <section class="tab-view" id="view-mezo" role="tabpanel" aria-labelledby="tab-mezo" hidden></section>

    <!-- TAB 3: MAKRO (B2G — Şəhər Peyk & Gələcək Yeraltı GIS) -->
    <section class="tab-view" id="view-makro" role="tabpanel" aria-labelledby="tab-makro" hidden></section>

    <!-- TAB 4: MAĞAZA (Marketplace) -->
    <section class="tab-view" id="view-magaza" role="tabpanel" aria-labelledby="tab-magaza" hidden></section>
  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="emerald-text" style="font-family:var(--font-display); font-weight:700; letter-spacing:0.12em;">İNJEKSİON</span>
        <span class="muted-text"><span aria-hidden="true">•</span> Luxury Eco-Tech Bio-Memarlıq &amp; Şəhərsalma Ekosistemi</span>
      </div>
      <div class="footer-meta muted-text">
        <span>Vahid Sərgi Platforması (B2C <span aria-hidden="true">•</span> B2B <span aria-hidden="true">•</span> B2G)</span>
        <span aria-hidden="true">•</span>
        <span>Azərbaycanın Bütün 87 Şəhər &amp; Rayonu</span>
      </div>
    </div>
  </footer>

  <!-- Mobile Bottom Navigation Dock -->
  <nav class="mobile-dock glass-panel" aria-label="Mobil Menyu">
    <button class="dock-btn active" data-tab="tanitim" type="button">
      <span data-icon="presentation" aria-hidden="true"></span>
      <span>Tanıtım</span>
    </button>
    <button class="dock-btn" data-tab="mikro" type="button">
      <span data-icon="cube" aria-hidden="true"></span>
      <span>Mikro</span>
    </button>
    <button class="dock-btn" data-tab="mezo" type="button">
      <span data-icon="building" aria-hidden="true"></span>
      <span>Mezo</span>
    </button>
    <button class="dock-btn" data-tab="makro" type="button">
      <span data-icon="map" aria-hidden="true"></span>
      <span>Makro</span>
    </button>
    <button class="dock-btn" data-tab="magaza" type="button">
      <span data-icon="store" aria-hidden="true"></span>
      <span>Mağaza</span>
    </button>
  </nav>

  <!-- Slide-Over Cart Drawer (Right Side) -->
  <div class="drawer-backdrop" id="cart-backdrop" aria-hidden="true"></div>
  <aside class="cart-drawer glass-panel" id="cart-drawer" aria-label="Səbət pəncərəsi" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <h2 class="drawer-title">Səbət</h2>
        <p class="drawer-subtitle" id="cart-drawer-subtitle">0 məhsul seçilib</p>
      </div>
      <button class="icon-close-btn" id="close-cart-btn" type="button" aria-label="Bağla">
        <span data-icon="x" aria-hidden="true"></span>
      </button>
    </div>

    <div class="drawer-body" id="cart-items-container"></div>

    <div class="drawer-footer" id="cart-drawer-footer">
      <div class="cart-summary-rows">
        <div class="summary-row">
          <span>Çatdırılma və Quraşdırma</span>
          <span class="emerald-text">Yerli Tərəfdaş Şəbəkəsi (Pulsuz)</span>
        </div>
        <div class="summary-row total-row">
          <span>Yekun Məbləğ</span>
          <span class="total-amount" id="cart-total-amount">0 AZN</span>
        </div>
      </div>
      <button class="btn-primary btn-full" id="checkout-btn" type="button">
        <span data-icon="check" aria-hidden="true"></span>
        <span>Sifarişi Rəsmiləşdir</span>
      </button>
    </div>
  </aside>

  <!-- Generic Modal Container -->
  <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
    <div class="modal-dialog glass-panel" id="modal-dialog" role="dialog" aria-modal="true" aria-label="Məlumat pəncərəsi">
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Toast Notification Stack -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Scripts (Classic order for 100% file:// & GitHub Pages compatibility) -->
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/regions.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/tanitim.js"></script>
  <script src="js/mikro.js"></script>
  <script src="js/mezo.js"></script>
  <script src="js/makro.js"></script>
  <script src="js/magaza.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
